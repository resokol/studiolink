name: Windows Native Build
on:
  push:
    branches: [dev/windows-native]
    paths:
      - "apps/studio-windows/**"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/studio-windows
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/Release/StudioLinkStudio.exe dist/StudioLink-Studio-Windows-x64.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: StudioLink-Studio-Windows-x64
          path: apps/studio-windows/dist/StudioLink-Studio-Windows-x64.exe
